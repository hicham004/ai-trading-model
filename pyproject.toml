[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-model"
version = "0.1.0"
description = "Phase 1 research workspace: public OKX market data, storage, backtest skeleton."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
