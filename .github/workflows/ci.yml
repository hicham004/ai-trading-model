name: CI

# Runs the offline test suite on every pull request to main and on pushes to
# feature branches. It NEVER merges, deploys, or touches a real/production
# environment.
#
# SECURITY INVARIANT (do not regress): this workflow checks out and runs
# PR-controlled code (pip install, pytest, repo scripts), so it must hold NO
# secrets. There is no `secrets.*` reference anywhere in this file.
# `tests/test_ci_workflow_isolation.py` enforces this.
#
# Least privilege: read-only repository access, so this workflow is
# structurally incapable of pushing, merging, or releasing. Merge / deploy /
# phase-advancement remain human actions.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches-ignore: [main]   # feature branches only; never act on main pushes
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The branch protection rule for main requires this check by its name.
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Byte-compile (fast syntax check)
        run: python -m compileall -q app scripts

      - name: Run tests (pytest)
        run: |
          set -o pipefail
          python -m pytest -q | tee pytest-summary.txt

      - name: Write CI step summary
        if: ${{ always() }}
        run: |
          {
            echo "## Tests"
            echo '```'
            tail -n 30 pytest-summary.txt 2>/dev/null || echo "(no pytest output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
