# Alembic configuration (schema migrations; Sprint 0 baseline).
#
# The database URL is deliberately NOT stored here. migrations/env.py resolves
# it, in order, from: `-x url=<sqlalchemy-url>` on the command line, the
# `sqlalchemy.url` option below (left empty), then
# app.config.get_settings().database_url (DATABASE_URL / .env). No production
# trading URL exists anywhere in this repository.
#
# Usage (see docs/runbooks/DB_MIGRATIONS.md):
#   alembic upgrade head                 # apply migrations to DATABASE_URL
#   alembic stamp head                   # mark an existing create_all DB as current
#   alembic revision --autogenerate -m "..."   # after editing app/db/models.py

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
